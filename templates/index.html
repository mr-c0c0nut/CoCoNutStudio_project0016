<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCoNut Studio - Competitive Tierlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(99, 102, 241, 0.4);
            --primary-accent: #6366f1;
            --secondary-accent: #a855f7;
            --cyan-accent: #06b6d4;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glassmorphism & Aurora Background */
        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora-blob {
            position: absolute;
            filter: blur(120px);
            opacity: 0.25;
            border-radius: 50%;
            animation: float 20s infinite alternate ease-in-out;
        }

        .aurora-1 {
            top: -10%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: var(--primary-accent);
        }

        .aurora-2 {
            bottom: -10%;
            right: 15%;
            width: 600px;
            height: 600px;
            background: var(--secondary-accent);
        }

        .aurora-3 {
            top: 40%;
            left: 50%;
            width: 450px;
            height: 450px;
            background: var(--cyan-accent);
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.15); }
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(9, 10, 15, 0.6);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.35rem;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            font-size: 0.7rem;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .nav-actions button {
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            color: #fff;
            border: none;
            padding: 0.65rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
        }

        .nav-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 4rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 2rem auto;
            line-height: 1.6;
        }

        /* Section Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Top 3 Podium */
        .podium-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 900px) {
            .podium-grid {
                grid-template-columns: 1fr;
            }
        }

        .podium-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            backdrop-filter: var(--glass-blur);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .podium-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-hover-border);
        }

        .podium-card.rank-1 {
            border-color: rgba(245, 158, 11, 0.3);
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
        }

        .podium-card.rank-2 {
            border-color: rgba(148, 163, 184, 0.3);
        }

        .podium-card.rank-3 {
            border-color: rgba(180, 83, 9, 0.3);
        }

        .rank-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .rank-1 .rank-badge { background: rgba(245, 158, 11, 0.2); color: var(--gold); border: 1px solid var(--gold); }
        .rank-2 .rank-badge { background: rgba(148, 163, 184, 0.2); color: var(--silver); border: 1px solid var(--silver); }
        .rank-3 .rank-badge { background: rgba(180, 83, 9, 0.2); color: var(--bronze); border: 1px solid var(--bronze); }

        .player-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 2px solid var(--card-border);
        }

        .rank-1 .player-avatar { border-color: var(--gold); }
        .rank-2 .player-avatar { border-color: var(--silver); }
        .rank-3 .player-avatar { border-color: var(--bronze); }

        .player-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .total-score {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 1.2rem;
        }

        .total-score span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .mode-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .mode-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .mode-chip img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .tier-badge {
            color: #818cf8;
            font-weight: 700;
        }

        /* Full Ranking Table Section */
        .ranking-view {
            transition: all 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: var(--glass-blur);
            overflow: hidden;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .ranking-table th {
            padding: 1.2rem 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .ranking-table td {
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.95rem;
        }

        .ranking-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .rank-num {
            font-weight: 800;
            width: 60px;
        }

        .rank-num.top-1 { color: var(--gold); }
        .rank-num.top-2 { color: var(--silver); }
        .rank-num.top-3 { color: var(--bronze); }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="aurora-container">
        <div class="aurora-blob aurora-1"></div>
        <div class="aurora-blob aurora-2"></div>
        <div class="aurora-blob aurora-3"></div>
    </div>

    <nav>
        <div class="logo">
            CoCoNut Studio <span class="logo-badge">TIERLIST</span>
        </div>
        <div class="nav-actions">
            <button id="toggle-ranking-btn" onclick="toggleView('full')">Full Rankings</button>
        </div>
    </nav>

    <div class="main-container">
        
        <!-- HERO SECTION -->
        <div class="hero">
            <h1>Official Community Leaderboard</h1>
            <p>Hệ thống xếp hạng kỹ năng Minecraft PvP tổng hợp từ CoCoNut Studio. Cập nhật trực tiếp từ Backend Engine.</p>
        </div>

        <!-- HOME / LIVE VIEW (TOP 3) -->
        <div id="live-view" class="ranking-view">
            <div class="section-header">
                <div class="section-title">
                    🔥 Live Top 3 Leaderboard
                </div>
            </div>

            <div class="podium-grid" id="podium-container">
                <!-- Top 3 rendered via JavaScript -->
            </div>
        </div>

        <!-- FULL RANKING VIEW -->
        <div id="full-view" class="ranking-view hidden">
            <div class="section-header">
                <div class="section-title">
                    🏆 Full Community Ranking
                </div>
                <button class="btn-back" onclick="toggleView('live')">← Quay lại Top 3</button>
            </div>

            <div class="table-card">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Total Points</th>
                            <th>Modes & Tier Breakdown</th>
                        </tr>
                    </thead>
                    <tbody id="full-ranking-body">
                        <!-- Full ranking rendered via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let globalLeaderboardData = [];

        // Fetch data directly from backend API
        async function fetchLeaderboardData() {
            try {
                const response = await fetch('/api/leaderboard');
                if (!response.ok) throw new Error('Network response was not ok');
                globalLeaderboardData = await response.json();
                
                renderTop3(globalLeaderboardData);
                renderFullRanking(globalLeaderboardData);
            } catch (error) {
                console.error("Error fetching ranking data:", error);
            }
        }

        // Render Top 3 Podium
        function renderTop3(data) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            const top3 = data.slice(0, 3);
            
            top3.forEach((player) => {
                const card = document.createElement('div');
                card.className = `podium-card rank-${player.rank}`;

                const modeChips = player.modes.map(m => `
                    <div class="mode-chip">
                        <img src="${m.icon}" alt="${m.name}" />
                        <span>${m.name}</span>
                        <span class="tier-badge">${m.tier}</span>
                        <span>(${m.points}p)</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="rank-badge">#${player.rank}</div>
                    <div class="player-avatar">${player.username.charAt(0).toUpperCase()}</div>
                    <div class="player-name">${player.username}</div>
                    <div class="total-score">${player.total_points} <span>PTS</span></div>
                    <div class="mode-tags">${modeChips}</div>
                `;

                container.appendChild(card);
            });
        }

        // Render Full Ranking Table
        function renderFullRanking(data) {
            const tbody = document.getElementById('full-ranking-body');
            tbody.innerHTML = '';

            data.forEach((player) => {
                const tr = document.createElement('tr');

                const modeChips = player.modes.map(m => `
                    <div class="mode-chip" style="display:inline-flex; margin-right:6px; margin-bottom:4px;">
                        <img src="${m.icon}" alt="${m.name}" />
                        <span>${m.name}</span>
                        <span class="tier-badge">${m.tier}</span>
                        <span>(${m.points}p)</span>
                    </div>
                `).join('');

                let rankClass = '';
                if (player.rank === 1) rankClass = 'top-1';
                else if (player.rank === 2) rankClass = 'top-2';
                else if (player.rank === 3) rankClass = 'top-3';

                tr.innerHTML = `
                    <td class="rank-num ${rankClass}">#${player.rank}</td>
                    <td style="font-weight:700;">${player.username}</td>
                    <td style="font-weight:800; color:var(--primary-accent);">${player.total_points}</td>
                    <td>${modeChips}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // View Switcher logic
        function toggleView(view) {
            const liveView = document.getElementById('live-view');
            const fullView = document.getElementById('full-view');
            const navBtn = document.getElementById('toggle-ranking-btn');

            if (view === 'full') {
                liveView.classList.add('hidden');
                fullView.classList.remove('hidden');
                navBtn.setAttribute('onclick', "toggleView('live')");
                navBtn.innerText = "Back to Top 3";
            } else {
                fullView.classList.add('hidden');
                liveView.classList.remove('hidden');
                navBtn.setAttribute('onclick', "toggleView('full')");
                navBtn.innerText = "Full Rankings";
            }
        }

        // Auto load on start
        document.addEventListener('DOMContentLoaded', fetchLeaderboardData);
    </script>
</body>
</html>
