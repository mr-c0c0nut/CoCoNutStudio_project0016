<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft PvP Ranking Leaderboard</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #6366f1;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --rank-1: #fbbf24;
            --rank-2: #94a3b8;
            --rank-3: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: grid;
            grid-template-columns: 70px 1fr auto;
            align-items: center;
            gap: 1rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .rank-badge {
            font-size: 1.2rem;
            font-weight: 800;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-card[data-rank="1"] .rank-badge {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(217, 119, 6, 0.3));
            color: var(--rank-1);
            border-color: rgba(251, 191, 36, 0.4);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }

        .player-card[data-rank="2"] .rank-badge {
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.2), rgba(71, 85, 105, 0.3));
            color: var(--rank-2);
            border-color: rgba(148, 163, 184, 0.4);
        }

        .player-card[data-rank="3"] .rank-badge {
            background: linear-gradient(135deg, rgba(180, 83, 9, 0.2), rgba(120, 53, 15, 0.3));
            color: #f97316;
            border-color: rgba(249, 115, 22, 0.4);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
        }

        .player-username {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .mode-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .mode-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .mode-tier {
            font-weight: 700;
            color: #a5b4fc;
        }

        .mode-pts {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .total-points {
            text-align: right;
            padding-left: 1rem;
        }

        .points-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #60a5fa;
            line-height: 1;
        }

        .points-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        @media (max-width: 640px) {
            .player-card {
                grid-template-columns: 50px 1fr;
                gap: 0.75rem;
                padding: 0.85rem;
            }

            .total-points {
                grid-column: span 2;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                padding-top: 0.5rem;
                padding-left: 0;
                margin-top: 0.25rem;
            }

            .points-value {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PvP Tier Leaderboard</h1>
            <p>Official Player Rankings & Mode Breakdown</p>
        </div>

        <div class="leaderboard">
            {% for player in rankings %}
            <div class="player-card" data-rank="{{ player.rank }}">
                <div class="rank-badge">
                    #{{ player.rank }}
                </div>
                
                <div class="player-info">
                    <div class="player-username">{{ player.username }}</div>
                    <div class="modes-list">
                        {% for m in player.modes %}
                        <div class="mode-chip">
                            <img src="{{ mode_icons[m.mode] }}" alt="{{ m.mode }}" class="mode-icon" loading="lazy">
                            <span>{{ m.mode }}</span>
                            <span class="mode-tier">{{ m.tier }}</span>
                            <span class="mode-pts">({{ m.points }} pts)</span>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="total-points">
                    <div class="points-value">{{ player.total_points }}</div>
                    <div class="points-label">Total Points</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
